spring.application.name=parcel-delivery

# H2 in-memory database (data resets when the app stops)
spring.datasource.url=jdbc:h2:mem:parceldb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 web console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8081
# Listen on all interfaces so phone on same Wi-Fi can connect
server.address=0.0.0.0

# Multipart uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# Local image storage
delivery.upload-dir=uploads

# Default hub (return stop)
delivery.hub.name=J&T Express-Klang Jaya (Pjs380)
delivery.hub.lat=3.010177
delivery.hub.lng=101.458588

# Tesseract (Homebrew default on Apple Silicon)
delivery.tesseract.data-path=/opt/homebrew/share/tessdata
delivery.tesseract.language=eng
